name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # vite-plugin-cesium copies into dist/<base>/cesium when base is /STORMVERSE/,
      # but Pages serves the artifact root at /STORMVERSE/ — flatten to dist/cesium.
      - name: Fix Cesium path for project Pages
        run: |
          if [ -d dist/STORMVERSE/cesium ]; then
            rm -rf dist/cesium
            mv dist/STORMVERSE/cesium dist/cesium
            rm -rf dist/STORMVERSE
          fi
          test -f dist/index.html
          test -f dist/cesium/Cesium.js
          test -d dist/assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
